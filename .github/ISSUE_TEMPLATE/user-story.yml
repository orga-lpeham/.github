name: User Story
description: Describe a goal from the perspective of the person who needs it
title: "[User Story] "
type: User Story
body:
  - type: textarea
    id: user_story
    attributes:
      label: User story
      description: Describe who needs this, what they need, and why.
      placeholder: As a [user], I want [goal], so that [benefit].
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: List the conditions that must be met for this story to be complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and references
      description: Link related epics, issues, or useful context.
    validations:
      required: false
